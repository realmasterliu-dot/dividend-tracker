name: connectivity-probe

# 数据源连通性探测 —— 不写入任何数据，只报告哪些源在 GitHub Actions 的
# 境外 runner 上真正可用。
#
# 存在的理由：沙箱/本地开发多在境内网络，Actions runner 在境外，两者的
# 可达性几乎相反 ——
#   境内：东财/天天基金 通，Binance/CoinGecko/Yahoo 不通
#   境外：加密源大概率通，东财系可能限流或被风控
# 因此「本地能跑」不代表「CI 能跑」，反之亦然。改数据源之前先跑这个。
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'   # 每周一 北京 11:40，跟踪源可用性漂移

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/pipeline/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/pipeline/requirements.txt

      - name: 探测所有数据源
        run: python scripts/pipeline/fetch_all.py --probe --verbose | tee /tmp/probe.log

      - name: 裸连通性测试（绕过 akshare，直连各站点）
        if: always()
        run: |
          echo "### 裸连通性（HTTP 状态码）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 站点 | 用途 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          probe() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 \
                   -H "User-Agent: Mozilla/5.0" "$2" 2>/dev/null || echo "000")
            if [ "$code" = "000" ]; then mark="❌ 不可达"; else mark="✅ $code"; fi
            echo "| $1 | $3 | $mark |" >> $GITHUB_STEP_SUMMARY
          }
          probe "push2.eastmoney.com"  "https://push2.eastmoney.com"                                              "A股/港股/美股行情"
          probe "fund.eastmoney.com"   "https://fund.eastmoney.com"                                               "基金净值"
          probe "datacenter.eastmoney" "https://datacenter-web.eastmoney.com"                                     "分红送配"
          probe "api.binance.com"      "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"               "加密（主）"
          probe "api.coingecko.com"    "https://api.coingecko.com/api/v3/ping"                                    "加密（备）"
          probe "api.coinbase.com"     "https://api.coinbase.com/v2/prices/BTC-USD/spot"                          "加密（备）"
          probe "api.frankfurter.dev"  "https://api.frankfurter.dev/v1/latest?base=USD&symbols=CNY"               "汇率（主）"
          probe "open.er-api.com"      "https://open.er-api.com/v6/latest/USD"                                    "汇率（备）"
          probe "api.gold-api.com"     "https://api.gold-api.com/price/XAU"                                       "黄金现货"
          probe "www.sge.com.cn"       "https://www.sge.com.cn"                                                   "上金所（境内已挂）"
          probe "api.nasdaq.com"       "https://api.nasdaq.com/api/quote/AAPL/dividends?assetclass=stocks"        "美股分红"
          probe "query1.finance.yahoo" "https://query1.finance.yahoo.com/v8/finance/chart/AAPL"                   "yfinance"

      - name: 上传探测日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: /tmp/probe.log
          retention-days: 30
